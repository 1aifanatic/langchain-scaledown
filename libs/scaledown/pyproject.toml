[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-scaledown"
version = "0.2.0"
description = "ScaleDown summarization, compression, tool-output compression, and extraction middleware for LangChain agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ScaleDown" }]
keywords = ["langchain", "scaledown", "middleware", "agents", "compression", "summarization", "extraction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-core>=1.4.0,<2.0.0",
    "langchain>=1.4.5,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]

[project.urls]
"Source Code" = "https://github.com/scaledown-team/langchain-scaledown/tree/main/libs/scaledown"
repository = "https://github.com/scaledown-team/langchain-scaledown"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.2,<1.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-watcher>=0.3.4,<1.0.0",
    "langchain-tests>=1.0.0,<2.0.0",
]
codespell = ["codespell>=2.2.6,<3.0.0"]
test_integration = []
lint = ["ruff>=0.5,<0.6"]
typing = ["mypy>=1.10,<2.0", "types-requests>=2.32.0"]
dev = []

[tool.mypy]
disallow_untyped_defs = "True"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.per-file-ignores]
"scripts/smoke_test.py" = ["T201"]
"examples/*.py" = ["T201"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
